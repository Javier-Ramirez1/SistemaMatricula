<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Rol - Matrícula App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .form-control {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Matrícula App</a>
            <div class="collapse navbar-collapse justify-content-end">
                <a href="/roles" class="btn btn-outline-secondary btn-sm">Cancelar</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Crear Nuevo Rol</h1>
            <p class="text-muted">Ingresa el nombre para dar de alta un nuevo rol de seguridad en la aplicación.</p>
        </div>

        <div class="form-container">
            <form th:action="@{/roles/nuevo}" method="post">
                <div class="mb-4">
                    <label for="nombreRol" class="form-label small fw-semibold text-muted">Nombre del Rol</label>
                    <input type="text" class="form-control" id="nombreRol" name="nombreRol" placeholder="Ej. AUXILIAR" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-custom w-100">Registrar Rol</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const errorMsg = /*[[${error}]]*/ null;
        const successMsg = /*[[${success}]]*/ null;
        if (errorMsg) {
            Swal.fire({
                icon: 'error',
                title: '¡Error!',
                text: errorMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        if (successMsg) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: successMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        /*]]>*/
    </script>
</body>
</html>
