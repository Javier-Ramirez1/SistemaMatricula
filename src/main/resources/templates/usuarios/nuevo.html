<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .form-control, .form-select {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Matrícula App</a>
            <div class="collapse navbar-collapse justify-content-end">
                <a href="/usuarios" class="btn btn-outline-secondary btn-sm">Cancelar</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-4">
            <h1 class="fw-bold">Crear Nuevo Usuario</h1>
            <p class="text-muted">Ingresa los datos para registrar un nuevo acceso al sistema.</p>
        </div>

        <div class="form-container">
            <form th:action="@{/usuarios/nuevo}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombres" class="form-label small fw-semibold text-muted">Nombres</label>
                        <input type="text" class="form-control" id="nombres" name="nombres" placeholder="Juan" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellidoPaterno" class="form-label small fw-semibold text-muted">Apellido Paterno</label>
                        <input type="text" class="form-control" id="apellidoPaterno" name="apellidoPaterno" placeholder="Pérez" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="apellidoMaterno" class="form-label small fw-semibold text-muted">Apellido Materno</label>
                        <input type="text" class="form-control" id="apellidoMaterno" name="apellidoMaterno" placeholder="Gómez" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="numeroDocumento" class="form-label small fw-semibold text-muted">Número de Documento (DNI)</label>
                        <input type="text" class="form-control" id="numeroDocumento" name="numeroDocumento" placeholder="70000000" pattern="[0-9]{8}" maxlength="8" title="El DNI debe contener exactamente 8 dígitos numéricos" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="correoElectronico" class="form-label small fw-semibold text-muted">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correoElectronico" name="correoElectronico" placeholder="juan.perez@colegio.edu.pe">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="celular" class="form-label small fw-semibold text-muted">Celular</label>
                        <input type="text" class="form-control" id="celular" name="celular" placeholder="999999999" pattern="[0-9]{9}" maxlength="9" title="El número de celular debe contener exactamente 9 dígitos numéricos">
                    </div>
                </div>
                <hr class="my-4 text-muted">
                <div class="mb-3">
                    <label for="username" class="form-label small fw-semibold text-muted">Nombre de Usuario (Acceso)</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="ej. juan_perez" required autocomplete="off">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold text-muted">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div class="mb-4">
                    <label for="idRol" class="form-label small fw-semibold text-muted">Rol Asignado</label>
                    <select class="form-select" id="idRol" name="idRol" required>
                        <option value="" disabled selected>Seleccione un Rol...</option>
                        <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-custom w-100">Registrar Usuario</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const errorMsg = /*[[${error}]]*/ null;
        const successMsg = /*[[${success}]]*/ null;
        if (errorMsg) {
            Swal.fire({
                icon: 'error',
                title: '¡Error!',
                text: errorMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        if (successMsg) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: successMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        /*]]>*/
    </script>
</body>
</html>
