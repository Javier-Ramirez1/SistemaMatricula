<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Aula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            min-height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1.5rem;
            box-shadow: 1px 0 3px 0 rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .main-content {
            margin-left: 260px;
            padding: 3rem;
        }
        .nav-link-custom {
            color: #475569;
            font-weight: 500;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            margin-bottom: 0.25rem;
        }
        .nav-link-custom:hover, .nav-link-custom.active {
            background-color: #f1f5f9;
            color: #4f46e5;
            font-weight: 600;
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .form-control, .form-select {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
    </style>
</head>
<body>
<!-- Sidebar Izquierdo -->
<div class="sidebar">
    <div>
        <h3 class="fw-bold mb-4 text-dark text-center">Matrícula App</h3>
        <hr>
        <nav class="mt-4">
            <a href="/" class="nav-link-custom">Panel Principal</a>
            <a href="/matriculas" class="nav-link-custom">Matrículas</a>
            <a href="/pagos/deudas" class="nav-link-custom">Cuentas y Pagos</a>
            <a href="/alumnos" class="nav-link-custom">Alumnos</a>
            <a href="/aulas" class="nav-link-custom active">Aulas y Secciones</a>
            <a href="/conceptos" class="nav-link-custom">Conceptos de Pago</a>
            <a href="/usuarios" class="nav-link-custom" sec:authorize="hasRole('SUPERUSUARIO')">Administración</a>
        </nav>
    </div>
    <div>
        <hr>
        <div class="mb-3 px-2">
            <div class="fw-bold text-dark text-uppercase small" style="letter-spacing: 0.05em;" th:text="${#authentication.principal.nombreCompleto}">Administrador</div>
            <div class="text-muted small" th:text="${#authentication.principal.rolNombre}">SUPERUSUARIO</div>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill">Cerrar Sesión</button>
        </form>
    </div>
</div>

<!-- Contenido Principal -->
<div class="main-content">
    <div class="mb-4">
        <h1 class="fw-bold">Editar Aula</h1>
        <p class="text-muted">Modifica la configuración de capacidad, nivel y grado del aula seleccionada.</p>
    </div>

    <div class="form-container">
        <div th:if="${error}" class="alert alert-danger text-center p-2 mb-3" style="background-color: #fef2f2; border-color: #fee2e2; color: #991b1b;" th:text="${error}">
            Error
        </div>

        <form th:action="@{/aulas/editar/{id}(id=${aula.codAula})}" method="post">
            <div class="mb-3">
                <label for="codAnioAcademico" class="form-label small fw-semibold text-muted">Año Académico</label>
                <select class="form-select" id="codAnioAcademico" name="codAnioAcademico" required>
                    <option th:each="a : ${anios}" th:value="${a.codAnioAcademico}" th:text="${a.anio}" th:selected="${a.codAnioAcademico == aula.anioAcademico.codAnioAcademico}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="codNivel" class="form-label small fw-semibold text-muted">Nivel de Estudio</label>
                <select class="form-select" id="codNivel" name="codNivel" required>
                    <option th:each="n : ${niveles}" th:value="${n.codNivel}" th:text="${n.nombreNivel}" th:selected="${n.codNivel == aula.nivel.codNivel}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="codGrado" class="form-label small fw-semibold text-muted">Grado Académico</label>
                <select class="form-select" id="codGrado" name="codGrado" required>
                    <option th:each="g : ${grados}" th:value="${g.codGrado}" th:text="${g.nombreGrado}" th:selected="${g.codGrado == aula.grado.codGrado}"></option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-4">
                    <label for="seccion" class="form-label small fw-semibold text-muted">Sección (Letra)</label>
                    <input type="text" class="form-control" id="seccion" name="seccion" th:value="${aula.seccion}" maxlength="2" required autocomplete="off">
                </div>
                <div class="col-md-6 mb-4">
                    <label for="capacidadMaxima" class="form-label small fw-semibold text-muted">Capacidad Máxima</label>
                    <input type="number" class="form-control" id="capacidadMaxima" name="capacidadMaxima" th:value="${aula.capacidadMaxima}" min="5" max="50" required>
                </div>
            </div>

            <div class="d-flex gap-3 justify-content-end mt-4">
                <a href="/aulas" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-custom px-4">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
