# ============================================================================
# CONFIGURACIÓN GENERAL DEL APLICATIVO (SPRING BOOT 3)
# ============================================================================
spring.application.name=control-cuentas

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE BASE DE DATOS (MYSQL 8)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://192.168.161.79:3310,192.168.161.140:3310/db_matricula_cuotas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&failOverReadOnly=false&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE
# ----------------------------------------------------------------------------
# ddl-auto=validate garantiza que Hibernate verifique el schema.sql sin recrearlo ni alterarlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE SEGURIDAD E INICIALIZACIÓN
# ----------------------------------------------------------------------------
# Deshabilitar la contraseña autogenerada temporal de Spring Security en consola
spring.security.user.name=admin
spring.security.user.password=admin123

# Habilitar inicialización SQL si se quiere correr automáticamente (opcional)
spring.sql.init.mode=never

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE CODIFICACIÓN (UTF-8)
# ----------------------------------------------------------------------------
spring.thymeleaf.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mvc.converters.preferred-json-mapper=jackson