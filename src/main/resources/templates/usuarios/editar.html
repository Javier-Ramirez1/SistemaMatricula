<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Usuario y Permisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .navbar-brand {
            color: #0f172a !important;
            font-weight: 700;
        }
        .container-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .nav-tabs .nav-link {
            color: #475569;
            font-weight: 500;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs .nav-link.active {
            color: #4f46e5;
            border: none;
            border-bottom: 2px solid #4f46e5;
            font-weight: 600;
        }
        .form-control, .form-select {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
        .table th {
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Matrícula App</a>
            <div class="collapse navbar-collapse justify-content-end">
                <a href="/usuarios" class="btn btn-outline-secondary btn-sm">Volver a la Lista</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-4">
            <h1 class="fw-bold" th:text="${'Configurar: ' + usuario.username}">Configurar Usuario</h1>
            <p class="text-muted">Administra los datos de la cuenta y los permisos granulares asociados.</p>
        </div>

        <div class="container-box">
            <!-- Pestañas de Navegación -->
            <ul class="nav nav-tabs mb-4" id="configTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button" role="tab" aria-controls="profile" aria-selected="true">Datos de Usuario</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="permissions-tab" data-bs-toggle="tab" data-bs-target="#permissions" type="button" role="tab" aria-controls="permissions" aria-selected="false">Permisos del Rol</button>
                </li>
            </ul>

            <!-- Contenido de las Pestañas -->
            <div class="tab-content" id="configTabsContent">
                <!-- Pestaña 1: Editar Datos -->
                <div class="tab-pane fade show active" id="profile" role="tabpanel" aria-labelledby="profile-tab">
                    <form th:action="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombres" class="form-label small fw-semibold text-muted">Nombres</label>
                                <input type="text" class="form-control" id="nombres" name="nombres" th:value="${usuario.persona.nombres}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellidoPaterno" class="form-label small fw-semibold text-muted">Apellido Paterno</label>
                                <input type="text" class="form-control" id="apellidoPaterno" name="apellidoPaterno" th:value="${usuario.persona.apellidoPaterno}" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="apellidoMaterno" class="form-label small fw-semibold text-muted">Apellido Materno</label>
                                <input type="text" class="form-control" id="apellidoMaterno" name="apellidoMaterno" th:value="${usuario.persona.apellidoMaterno}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="numeroDocumento" class="form-label small fw-semibold text-muted">Número de Documento (DNI)</label>
                                <input type="text" class="form-control" id="numeroDocumento" name="numeroDocumento" th:value="${usuario.persona.numeroDocumento}" pattern="[0-9]{8}" maxlength="8" title="El DNI debe contener exactamente 8 dígitos numéricos" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="correoElectronico" class="form-label small fw-semibold text-muted">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correoElectronico" name="correoElectronico" th:value="${usuario.persona.correoElectronico}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="celular" class="form-label small fw-semibold text-muted">Celular</label>
                                <input type="text" class="form-control" id="celular" name="celular" th:value="${usuario.persona.celular}" pattern="[0-9]{9}" maxlength="9" title="El número de celular debe contener exactamente 9 dígitos numéricos">
                            </div>
                        </div>
                        <hr class="my-4 text-muted">
                        <div class="mb-3">
                            <label for="username" class="form-label small fw-semibold text-muted">Nombre de Usuario (Acceso)</label>
                            <input type="text" class="form-control" id="username" name="username" th:value="${usuario.username}" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold text-muted">Contraseña (Dejar en blanco para no modificar)</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••">
                        </div>
                        <div class="mb-4">
                            <label for="idRol" class="form-label small fw-semibold text-muted">Rol Asignado</label>
                            <select class="form-select" id="idRol" name="idRol" required>
                                <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"
                                        th:selected="${r.idRol == usuario.rol.idRol}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-custom w-100">Guardar Datos</button>
                    </form>
                </div>

                <!-- Pestaña 2: Permisos de Rol -->
                <div class="tab-pane fade" id="permissions" role="tabpanel" aria-labelledby="permissions-tab">
                    <h5 class="fw-bold mb-3" th:text="${'Permisos del Rol: ' + usuario.rol.nombreRol}">Permisos</h5>
                    <p class="text-muted small mb-4">Los cambios aplicados aquí afectarán a todos los usuarios con el rol <strong th:text="${usuario.rol.nombreRol}"></strong>.</p>
                    
                    <form th:action="@{/usuarios/guardar-permisos}" method="post">
                        <input type="hidden" name="idRol" th:value="${usuario.rol.idRol}">
                        
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Funcionalidad / Módulo</th>
                                        <th class="text-center">Ver</th>
                                        <th class="text-center">Crear</th>
                                        <th class="text-center">Editar</th>
                                        <th class="text-center">Eliminar</th>
                                        <th class="text-center">Imprimir</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${permisos}">
                                        <td class="fw-medium" th:text="${p.funcionalidad.nombre}">Seguridad</td>
                                        <td class="text-center">
                                            <input class="form-check-input" type="checkbox" name="verIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.ver}">
                                        </td>
                                        <td class="text-center">
                                            <input class="form-check-input" type="checkbox" name="crearIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.crear}">
                                        </td>
                                        <td class="text-center">
                                            <input class="form-check-input" type="checkbox" name="editarIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.editar}">
                                        </td>
                                        <td class="text-center">
                                            <input class="form-check-input" type="checkbox" name="eliminarIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.eliminar}">
                                        </td>
                                        <td class="text-center">
                                            <input class="form-check-input" type="checkbox" name="imprimirIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.imprimir}">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-end mt-4">
                            <button type="submit" class="btn btn-success px-4" style="background-color: #16a34a; border: none; font-weight: 600;">Aplicar Permisos</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const errorMsg = /*[[${error}]]*/ null;
        const successMsg = /*[[${success}]]*/ null;
        if (errorMsg) {
            Swal.fire({
                icon: 'error',
                title: '¡Error!',
                text: errorMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        if (successMsg) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: successMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        /*]]>*/
    </script>
</body>
</html>
