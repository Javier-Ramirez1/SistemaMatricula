<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso Restringido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .icon-wrapper {
            background-color: #fee2e2;
            color: #ef4444;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-wrapper">
            🚫
        </div>
        <h2 class="fw-bold mb-2">Acceso Restringido</h2>
        <p class="text-muted mb-4">No cuentas con los permisos granulares necesarios para ingresar a este módulo. Si crees que se trata de un error, comunícate con el Administrador.</p>
        <div class="d-grid">
            <a href="/" class="btn btn-custom">Volver al Panel Principal</a>
        </div>
    </div>
</body>
</html>
