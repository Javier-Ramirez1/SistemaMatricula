<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Concepto de Pago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body>
<!-- Sidebar Izquierdo -->
<div class="sidebar d-flex flex-column justify-content-between">
    <div>
        <h3 class="fw-bold mb-4 text-dark text-center">Matrícula App</h3>
        <hr>
        <nav class="mt-4">
            <a href="/" class="nav-link-custom">Panel Principal</a>
            <a href="/matriculas" class="nav-link-custom">Matrículas</a>
            <a href="/pagos/deudas" class="nav-link-custom">Cuentas y Pagos</a>
            <a href="/alumnos" class="nav-link-custom">Alumnos</a>
            <a href="/aulas" class="nav-link-custom">Aulas y Secciones</a>
            <a href="/conceptos" class="nav-link-custom active">Conceptos de Pago</a>
            <a href="/usuarios" class="nav-link-custom" sec:authorize="hasRole('SUPERUSUARIO')">Administración</a>
        </nav>
    </div>
    <div>
        <hr>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill">Cerrar Sesión</button>
        </form>
    </div>
</div>

<!-- Contenido Principal -->
<div class="main-content">
    <div class="mb-4">
        <h1 class="fw-bold">Nuevo Concepto de Pago</h1>
        <p class="text-muted">Configura una tarifa asociándola al año académico y tipo de cobro.</p>
    </div>

    <div class="form-container">
        <div th:if="${error}" class="alert alert-danger text-center p-2 mb-3" style="background-color: #fef2f2; border-color: #fee2e2; color: #991b1b;" th:text="${error}">
            Error
        </div>

        <form th:action="@{/conceptos/nuevo}" method="post">
            <div class="mb-3">
                <label for="codAnioAcademico" class="form-label small fw-semibold text-muted">Año Académico</label>
                <select class="form-select" id="codAnioAcademico" name="codAnioAcademico" required>
                    <option th:each="a : ${anios}" th:value="${a.codAnioAcademico}" th:text="${a.anio}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="codTipoConcepto" class="form-label small fw-semibold text-muted">Tipo de Concepto</label>
                <div class="input-group">
                    <select class="form-select" id="codTipoConcepto" name="codTipoConcepto" required>
                        <option th:each="t : ${tiposConcepto}" th:value="${t.codTipoConcepto}" th:text="${t.descripcion}"></option>
                    </select>
                    <button type="button" class="btn btn-outline-indigo" id="btnNuevoTipo" style="border-color: #4f46e5; color: #4f46e5;">+ Nuevo Tipo</button>
                </div>
            </div>
            <div class="mb-3">
                <label for="nombreConcepto" class="form-label small fw-semibold text-muted">Nombre del Concepto</label>
                <input type="text" class="form-control" id="nombreConcepto" name="nombreConcepto" placeholder="Ej. Matricula 2026" required autocomplete="off">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="monto" class="form-label small fw-semibold text-muted">Monto (S/)</label>
                    <input type="number" step="0.01" class="form-control" id="monto" name="monto" placeholder="S/ 0.00" min="1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="ordenPago" class="form-label small fw-semibold text-muted">Orden de Pago (Secuencia)</label>
                    <input type="number" class="form-control" id="ordenPago" name="ordenPago" placeholder="Ej. 1" min="1" required>
                </div>
            </div>
            <div class="mb-4 form-check mt-3">
                <input type="checkbox" class="form-check-input" id="obligatorio" name="obligatorio" checked>
                <label class="form-check-label small fw-semibold text-muted" for="obligatorio">Este concepto es obligatorio al matricular</label>
            </div>

            <div class="d-flex gap-3 justify-content-end mt-4">
                <a href="/conceptos" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-custom px-4">Registrar Tarifa</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal para nuevo Tipo de Concepto -->
<div class="modal fade" id="modalTipo" tabindex="-1" aria-labelledby="modalTipoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header bg-indigo text-white border-0 py-3" style="background-color: #4f46e5; border-top-left-radius: 16px; border-top-right-radius: 16px;">
                <h5 class="modal-title fw-bold" id="modalTipoLabel" style="color: white;">Crear Nuevo Tipo de Tarifa</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label for="txtNuevoTipo" class="form-label small text-muted fw-semibold">Nombre/Descripción del nuevo Tipo</label>
                    <input type="text" class="form-control" id="txtNuevoTipo" placeholder="Ej. Cobro por buzon, Promociones">
                </div>
                <div id="modalTipoError" class="alert alert-danger p-2 small d-none" style="background-color: #fef2f2; border-color: #fee2e2; color: #991b1b;"></div>
            </div>
            <div class="modal-footer border-0 p-3 bg-light" style="border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnGuardarTipo" style="background-color: #4f46e5; border: none; font-weight: 600;">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btnNuevoTipo = document.getElementById("btnNuevoTipo");
        const modalTipo = new bootstrap.Modal(document.getElementById("modalTipo"));
        const btnGuardarTipo = document.getElementById("btnGuardarTipo");
        const txtNuevoTipo = document.getElementById("txtNuevoTipo");
        const modalTipoError = document.getElementById("modalTipoError");
        const selectTipo = document.getElementById("codTipoConcepto");

        btnNuevoTipo.addEventListener("click", function() {
            txtNuevoTipo.value = "";
            modalTipoError.classList.add("d-none");
            modalTipoError.innerText = "";
            modalTipo.show();
        });

        btnGuardarTipo.addEventListener("click", function() {
            const desc = txtNuevoTipo.value.trim();
            if (!desc) {
                modalTipoError.innerText = "Por favor ingrese un nombre.";
                modalTipoError.classList.remove("d-none");
                return;
            }

            btnGuardarTipo.disabled = true;

            fetch('/conceptos/api/tipos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ descripcion: desc })
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => { throw new Error(err.message || "Error al guardar el tipo."); });
                }
                return response.json();
            })
            .then(data => {
                // Crear nueva opcion en el selector
                const option = document.createElement("option");
                option.value = data.codTipoConcepto;
                option.text = data.descripcion;
                option.selected = true;
                selectTipo.appendChild(option);

                modalTipo.hide();
            })
            .catch(error => {
                modalTipoError.innerText = error.message;
                modalTipoError.classList.remove("d-none");
            })
            .finally(() => {
                btnGuardarTipo.disabled = false;
            });
        });
    });
</script>
</body>
</html>
