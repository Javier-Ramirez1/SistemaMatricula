<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Rol y Permisos - Matrícula App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        .navbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
        .container-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        .form-control {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            border-radius: 8px;
            padding: 0.65rem 0.8rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }
        .btn-custom {
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-custom:hover {
            background-color: #4338ca;
            color: white;
        }
        .table th {
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Matrícula App</a>
            <div class="collapse navbar-collapse justify-content-end">
                <a href="/roles" class="btn btn-outline-secondary btn-sm">Volver a la Lista</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-4">
            <h1 class="fw-bold" th:text="${'Configurar Rol: ' + rol.nombreRol}">Configurar Rol</h1>
            <p class="text-muted">Administra el nombre de este perfil y define sus permisos de acceso granular.</p>
        </div>

        <div class="container-box">
            <form th:action="@{/roles/editar/{id}(id=${rol.idRol})}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombreRol" class="form-label small fw-semibold text-muted">Nombre del Rol</label>
                        <input type="text" class="form-control" id="nombreRol" name="nombreRol" th:value="${rol.nombreRol}" required autocomplete="off">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="descripcion" class="form-label small fw-semibold text-muted">Descripción del Rol</label>
                        <input type="text" class="form-control" id="descripcion" name="descripcion" th:value="${rol.descripcion}" required autocomplete="off">
                    </div>
                </div>

                <hr class="my-4 text-muted">

                <h5 class="fw-bold text-dark mb-3">Permisos de Acceso</h5>
                <p class="text-muted small mb-4">Configura los accesos detallados que tendrán los usuarios asignados a este rol.</p>

                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Módulo</th>
                                <th class="text-center">Ver</th>
                                <th class="text-center">Crear</th>
                                <th class="text-center">Editar</th>
                                <th class="text-center">Eliminar</th>
                                <th class="text-center">Imprimir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${permisos}">
                                <td class="fw-semibold text-indigo" th:text="${p.funcionalidad.nombre}">Módulo</td>
                                <td class="text-center">
                                    <input class="form-check-input" type="checkbox" name="verIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.ver}">
                                </td>
                                <td class="text-center">
                                    <input class="form-check-input" type="checkbox" name="crearIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.crear}">
                                </td>
                                <td class="text-center">
                                    <input class="form-check-input" type="checkbox" name="editarIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.editar}">
                                </td>
                                <td class="text-center">
                                    <input class="form-check-input" type="checkbox" name="eliminarIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.eliminar}">
                                </td>
                                <td class="text-center">
                                    <input class="form-check-input" type="checkbox" name="imprimirIds" th:value="${p.idRolFuncionalidad}" th:checked="${p.imprimir}">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="text-end mt-4">
                    <button type="submit" class="btn btn-custom px-4">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const errorMsg = /*[[${error}]]*/ null;
        const successMsg = /*[[${success}]]*/ null;
        if (errorMsg) {
            Swal.fire({
                icon: 'error',
                title: '¡Error!',
                text: errorMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        if (successMsg) {
            Swal.fire({
                icon: 'success',
                title: '¡Éxito!',
                text: successMsg,
                confirmButtonColor: '#4f46e5'
            });
        }
        /*]]>*/
    </script>
</body>
</html>
